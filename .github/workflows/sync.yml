name: Sync OpenFoodFacts

# Exécution chaque semaine
on:
  # schedule:
  #   - cron: '0 3 * * 1'  # Lundi à 03:00 UTC
  workflow_dispatch:  # permet de déclencher manuellement

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      PRODUCTS_COLLECTION: ${{ secrets.PRODUCTS_COLLECTION }}


    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11  # adapte selon ton code

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo python-dotenv requests

      - name: Run OpenFoodFacts sync
        run: |
          python off_delta_synchronisation.py
